# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u5DE5\u4F5C\u7684\u6839\u76EE\u5F55
irdemo.dir.home = workspace
# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u7D22\u5F15\u5B58\u653E\u76EE\u5F55
irdemo.dir.idx = ${irdemo.dir.home}/idx
# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u722C\u866B\u6570\u636E\u5B58\u653E\u76EE\u5F55          
irdemo.dir.crawler = ${irdemo.dir.home}/crawler
# 数据库连接配置 - 请根据你的实际情况修改以下配置
spring.datasource.url=jdbc:mysql://10.199.201.199:3306/JudoPro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=jby
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 启用详细日志
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.cn.edu.bistu.cs.ir.controller=DEBUG
logging.level.cn.edu.bistu.cs.ir.service=DEBUG
logging.level.org.springframework.web=DEBUG

# 禁用WebMagic爬虫日志
logging.level.us.codecraft.webmagic.downloader=ERROR
logging.level.us.codecraft.webmagic=ERROR

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# 自定义文件上传配置
file.upload.upload-path=uploads
file.upload.max-file-size=52428800
file.upload.max-request-size=104857600
