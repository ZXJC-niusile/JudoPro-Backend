# 测试环境专用配置
irdemo.dir.home = workspace/test
irdemo.dir.idx = ${irdemo.dir.home}/idx
irdemo.dir.crawler = ${irdemo.dir.home}/crawler

# 单元测试采用 H2 内存数据库（MySQL 兼容模式），免除对外部真实数据库和网络 IP 的依赖
spring.datasource.url=jdbc:h2:mem:judopro_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 禁用测试日志噪音
logging.level.org.hibernate.SQL=WARN
logging.level.cn.edu.bistu.cs.ir=INFO
logging.level.org.springframework.web=WARN
logging.level.us.codecraft.webmagic=ERROR

# 文件上传配置
spring.servlet.multipart.enabled=true
file.upload.upload-path=workspace/test/uploads

# 外部服务配置（测试占位）
python.microservice.host=127.0.0.1
python.microservice.binary-port=8000
volcengine.base-url=https://ark.cn-beijing.volces.com
volcengine.api-key=test_api_key_placeholder
